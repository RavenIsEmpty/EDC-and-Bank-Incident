html { scroll-behavior:smooth; scroll-padding-top:80px; }
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.75 var(--khmer);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p { margin:0; }
button,input { font:inherit; color:inherit; }
button { cursor:pointer; }
button:focus-visible,input:focus-visible,[tabindex]:focus-visible,label:focus-visible,a:focus-visible {
  outline:3px solid #63bec8;
  outline-offset:2px;
}

/* HEADER */

.shell {
  width:min(1200px,calc(100% - 42px));
  margin:auto;
}
.top {
  position:sticky;
  top:0;
  z-index:5;
  background:#fffffff7;
  border-bottom:1px solid var(--border);
}
.top .shell {
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}
.mark {
  display:flex;
  align-items:center;
  font:700 13px var(--latin);
  letter-spacing:.08em;
  color:var(--navy);
}
.mark b {
  display:inline-grid;
  place-items:center;
  width:34px;
  height:34px;
  margin-right:12px;
  border-radius:9px;
  background:linear-gradient(135deg,#118896,#0b5f69);
  color:#fff;
  font-size:17px;
  letter-spacing:0;
  box-shadow:0 3px 10px #0f7c8740;
}
.nav { display:flex; gap:4px; align-items:center; }
.nav a {
  font:600 12.5px var(--latin);
  letter-spacing:.02em;
  color:var(--muted);
  text-decoration:none;
  padding:7px 13px;
  border-radius:8px;
  transition:background .15s,color .15s;
}
.nav a:hover { background:var(--light); color:var(--teal); }
.nav .sep { width:1px; height:18px; background:var(--border); margin:0 6px; }
.meta {
  font:650 11px var(--latin);
  letter-spacing:.08em;
  color:#7a8d9b;
}

.hero {
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(900px 300px at 85% -20%,#2a7083aa,transparent 70%),
    linear-gradient(115deg,#11293b,#1b4458);
  color:#fff;
  padding:56px 0 54px;
}
.hero:before {
  content:'';
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(#ffffff0a 1px,transparent 1px),
    linear-gradient(90deg,#ffffff0a 1px,transparent 1px);
  background-size:36px 36px;
  mask-image:linear-gradient(90deg,transparent,#000 60%);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 60%);
}
.hero .shell { position:relative; }
.hero small {
  display:inline-flex;
  align-items:center;
  gap:9px;
  font:700 11.5px var(--latin);
  letter-spacing:.14em;
  color:#9fdcdf;
  background:#ffffff10;
  border:1px solid #ffffff1f;
  padding:5px 12px;
  border-radius:999px;
}
.hero small:before {
  content:'';
  width:7px; height:7px; border-radius:50%;
  background:#5fd0d6;
  box-shadow:0 0 0 4px #5fd0d633;
}
.hero h1 {
  font-size:clamp(29px,3.7vw,42px);
  font-weight:700;
  line-height:1.55;
  margin:16px 0 4px;
}
.hero p {
  font:500 16px var(--latin);
  color:#cfe2e8;
  letter-spacing:.01em;
}
main { padding:40px 0 80px; }

/* SECTIONS */

.section { margin:0 0 60px; }
.section-title {
  display:flex;
  align-items:center;
  gap:22px;
  background:linear-gradient(120deg,var(--navy),var(--navy2));
  border-radius:16px;
  color:#fff;
  padding:22px 28px;
  margin-bottom:22px;
  box-shadow:0 10px 30px #132c3f26;
}
.section-num {
  font:800 42px var(--latin);
  color:#8fdbdf;
  border-right:1px solid #ffffff2b;
  padding-right:22px;
  line-height:1.1;
}
.section-title h2 {
  font:750 clamp(26px,2.6vw,34px)/1.24 var(--latin);
  letter-spacing:-.01em;
}
.section-title p {
  font-size:15.5px;
  color:#cfe2e9;
  margin-top:4px;
}

/* INCIDENT CARDS */

.incident {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow-sm);
  padding:26px 30px 30px;
  margin-bottom:24px;
}
.incident-head {
  display:flex;
  align-items:center;
  gap:15px;
  padding-bottom:18px;
  border-bottom:1px solid var(--border-soft);
  margin-bottom:28px;
}
.index {
  font:750 11.5px var(--latin);
  letter-spacing:.06em;
  color:var(--teal);
  border:1px solid #c3dfe2;
  background:#eef7f8;
  border-radius:7px;
  padding:6px 11px;
  white-space:nowrap;
}
.incident-head h3 {
  font-size:20px;
  font-weight:700;
  line-height:1.62;
}

/* FLOW NODES */

.flow {
  display:flex;
  align-items:stretch;
  gap:7px;
}
.node {
  min-width:0;
  flex:1;
  position:relative;
  min-height:132px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fafcfd;
  padding:16px 12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:9px;
}
.node .glyph {
  display:grid;
  place-items:center;
  width:46px;
  height:46px;
  border-radius:12px;
  background:#eaf5f6;
  color:var(--teal);
  flex:0 0 auto;
}
.node .glyph svg { width:26px; height:26px; }
.node strong {
  font-size:14.5px;
  font-weight:600;
  line-height:1.7;
}
.node small {
  font-size:13px;
  color:var(--muted);
}
.node.good {
  background:var(--greenbg);
  border-color:#b6dfcf;
}
.node.good .glyph { color:var(--green); background:#dcf1e7; }
.node.pending {
  background:var(--amberbg);
  border-color:#ecdcc0;
}
.node.pending .glyph { color:var(--amber); background:#fbeccf; }
.node.end,.node.issue {
  background:var(--redbg);
  border-color:#eac3c5;
}
.node.issue {
  border-width:1.5px;
  cursor:pointer;
  transition:box-shadow .2s,border-color .2s,transform .2s;
}
.node.issue:hover,.branch:hover {
  box-shadow:0 0 0 4px #b3434b17, 0 10px 24px #b3434b1a;
  border-color:var(--red);
  transform:translateY(-2px);
}
.node.issue:before,.branch:before {
  content:'ចំណុចបញ្ហា';
  position:absolute;
  top:-13px;
  right:10px;
  font-size:11.5px;
  font-weight:700;
  color:#fff;
  background:var(--red);
  border-radius:6px;
  padding:1px 10px;
  box-shadow:0 3px 8px #b3434b40;
}
.node.issue .glyph,.node.end .glyph {
  color:var(--red);
  background:#fbe3e3;
}
.inspect-hint {
  display:inline-flex;
  align-items:center;
  gap:6px;
  font:600 12px var(--latin);
  color:var(--teal);
  background:#fff;
  border:1px solid #bfe0e3;
  border-radius:999px;
  padding:3px 12px;
  transition:background .2s,color .2s;
}
.node.issue:hover .inspect-hint,.branch:hover .inspect-hint {
  background:var(--teal);
  border-color:var(--teal);
  color:#fff;
}

/* ANIMATED ARROWS */

.arrow {
  position:relative;
  width:29px;
  flex:0 0 29px;
  align-self:center;
  height:28px;
  color:var(--teal);
}
.arrow:before {
  content:'';
  position:absolute;
  top:13px;
  left:0;
  right:10px;
  height:2px;
  background:repeating-linear-gradient(
    90deg,currentColor 0 6px,
    transparent 6px 12px
  );
  background-size:12px 2px;
  animation:travel .8s linear infinite;
}
.arrow:after {
  content:'';
  position:absolute;
  right:0;
  top:7px;
  border-top:7px solid transparent;
  border-bottom:7px solid transparent;
  border-left:10px solid currentColor;
}
.outcome {
  margin-top:24px;
  padding:14px 18px;
  border:1px solid #cfe6e8;
  border-left:4px solid var(--teal);
  border-radius:10px;
  background:#f1f8f9;
  font-size:15px;
}
.outcome b { color:#127280; }

/* CALLBACK FLOW */

.callback {
  width:min(930px,100%);
  margin:auto;
}
.chain {
  display:flex;
  flex-direction:column;
  align-items:center;
}
.chain .node {
  width:min(460px,100%);
  min-height:84px;
  flex:0 0 auto;
  flex-direction:row;
  text-align:center;
  gap:14px;
}
.down {
  height:42px;
  width:26px;
  position:relative;
  color:var(--teal);
}
.down:before {
  content:'';
  position:absolute;
  top:0;
  bottom:10px;
  left:12px;
  width:2px;
  background:repeating-linear-gradient(
    180deg,currentColor 0 6px,
    transparent 6px 12px
  );
  background-size:2px 12px;
  animation:travelDown .85s linear infinite;
}
.down:after {
  content:'';
  position:absolute;
  bottom:0;
  left:6px;
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-top:10px solid currentColor;
}

/* FORK + MERGE */

.fork {
  width:100%;
  height:82px;
  display:block;
  overflow:visible;
}
.fork .base {
  fill:none;
  stroke:#c9dce2;
  stroke-width:2.6;
  vector-effect:non-scaling-stroke;
}
.fork .signal {
  fill:none;
  stroke:var(--teal);
  stroke-width:2.3;
  stroke-dasharray:7 10;
  vector-effect:non-scaling-stroke;
  animation:travelPath 1.5s linear infinite;
}
.fork .tip { fill:var(--teal); }

.branch-pair {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
  position:relative;
}
.branch {
  position:relative;
  border:1.5px solid #eccacb;
  border-top:4px solid #c25c63;
  border-radius:12px;
  background:#fff9f8;
  min-height:216px;
  padding:28px 22px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  text-align:center;
  color:inherit;
  transition:box-shadow .2s,border-color .2s,transform .2s;
}
.branch .case-id {
  font:700 11.5px var(--latin);
  color:#a84c53;
  letter-spacing:.08em;
}
.branch strong {
  font-size:18px;
  font-weight:700;
  color:#7f3a41;
  line-height:1.6;
}
.branch p {
  font-size:14.5px;
  line-height:1.8;
  color:#6e5a5e;
}
.or {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#fff;
  border:1px solid var(--border);
  border-radius:30px;
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  color:var(--muted);
  font-weight:700;
  box-shadow:var(--shadow-sm);
  pointer-events:none;
}

/* RESPONSE CODES */

.compare {
  display:grid;
  grid-template-columns:1fr 40px 1fr;
  gap:14px;
  align-items:center;
  margin-top:26px;
}
.resp {
  border:1px solid var(--border);
  border-radius:12px;
  background:#fbfcfd;
  padding:20px 24px;
  position:relative;
  overflow:hidden;
}
.resp:after {
  content:'';
  position:absolute;
  left:0; top:0; bottom:0;
  width:4px;
}
.resp.bad {
  background:var(--redbg);
  border-color:#eac3c4;
}
.resp.bad:after { background:var(--red); }
.resp.ok {
  background:var(--greenbg);
  border-color:#b6dfcf;
}
.resp.ok:after { background:var(--green); }
.resp small {
  font:700 11.5px var(--latin);
  color:var(--muted);
  letter-spacing:.08em;
}
.resp .value {
  font:800 44px/1.2 var(--latin);
  margin:8px 0 4px;
  letter-spacing:-.01em;
}
.resp.bad .value { color:var(--red); }
.resp.ok .value { color:var(--green); }
.resp p { font:500 15px var(--latin); }
.versus {
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  border-radius:50%;
  background:#fff;
  border:1px solid var(--border);
  font:750 11px var(--latin);
  color:var(--muted);
}

.reference {
  margin:44px 0 16px;
  font:750 23px var(--latin);
  display:flex;
  align-items:center;
  gap:12px;
}
.reference:before {
  content:'';
  width:4px;
  height:24px;
  border-radius:4px;
  background:var(--teal);
}
.table-card {
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:22px 24px;
  margin:16px 0;
  box-shadow:var(--shadow-sm);
}
.table-card h4 {
  font:700 17px var(--latin);
  margin-bottom:14px;
}
.table-scroll {
  overflow:auto;
  border:1px solid var(--border-soft);
  border-radius:10px;
}
.table-card table {
  border-collapse:collapse;
  width:100%;
  font:14px/1.5 var(--latin);
  text-align:left;
}
.table-card th,.table-card td {
  padding:11px 16px;
  border-bottom:1px solid #e9eef1;
}
.table-card tr:last-child td { border-bottom:0; }
.table-card th {
  background:#f1f6f8;
  color:#4a6476;
  font-size:12px;
  letter-spacing:.06em;
  text-transform:uppercase;
}
.table-card tr:nth-child(even) td { background:#fafcfd; }
.table-card td:first-child {
  font-weight:700;
  width:88px;
  font-variant-numeric:tabular-nums;
}
.table-card td:nth-child(2) { width:118px; }
.code-type {
  display:inline-block;
  background:#fbecec;
  color:#9b3d44;
  border-radius:999px;
  padding:3px 10px;
  font:700 11.5px var(--latin);
}
.code-type.ok {
  background:#e3f4e9;
  color:#187455;
}

/* ========== DETAIL VIEWER (large modal) ========== */

#scrim[hidden],#inspector[hidden] { display:none; }
#scrim {
  position:fixed;
  inset:0;
  background:#0b1f2ea6;
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
  z-index:10;
  animation:fade .18s ease;
}
#inspector {
  position:fixed;
  inset:0;
  margin:auto;
  width:min(1320px,calc(100vw - 48px));
  height:min(900px,calc(100vh - 48px));
  background:#fff;
  z-index:11;
  border-radius:18px;
  box-shadow:var(--shadow-lg);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  animation:pop .22s cubic-bezier(.2,.8,.2,1);
  transition:width .25s ease,height .25s ease,border-radius .25s ease;
}
#inspector.max {
  width:100vw;
  height:100vh;
  border-radius:0;
}
body.inspecting { overflow:hidden; }

.drawer-header {
  background:linear-gradient(120deg,var(--navy),var(--navy2));
  color:#fff;
  padding:20px 28px 18px;
}
.drawer-heading {
  display:flex;
  gap:16px;
  justify-content:space-between;
  align-items:center;
}
.drawer-heading > div:first-child { min-width:0; }
.drawer-heading small {
  display:inline-block;
  font:700 11px var(--latin);
  color:#9fdcdf;
  letter-spacing:.1em;
  background:#ffffff12;
  border:1px solid #ffffff22;
  border-radius:999px;
  padding:3px 11px;
}
.drawer-heading h2 {
  font-size:22px;
  font-weight:700;
  line-height:1.55;
  margin-top:8px;
}
.head-actions { display:flex; gap:8px; flex:0 0 auto; }
.icon-btn {
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  border:1px solid #ffffff2e;
  border-radius:10px;
  background:#ffffff14;
  color:#fff;
  padding:0;
  font-size:24px;
  line-height:1;
  transition:background .15s;
}
.icon-btn:hover { background:#ffffff2a; }
.icon-btn svg { width:18px; height:18px; }
.icon-btn.light {
  width:34px; height:34px;
  border-color:var(--border);
  background:#f4f7f9;
  color:var(--navy);
  font-size:20px;
}
.icon-btn.light:hover { background:#e8eef2; }

.tabs {
  display:flex;
  gap:4px;
  padding:0 22px;
  border-bottom:1px solid var(--border);
  background:#fff;
}
.tabs button {
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:0;
  background:transparent;
  color:#5f7688;
  padding:14px 18px 13px;
  font-weight:600;
  font-size:15px;
  transition:color .15s;
}
.tabs button:after {
  content:'';
  position:absolute;
  left:12px; right:12px; bottom:-1px;
  height:3px;
  border-radius:3px 3px 0 0;
  background:transparent;
}
.tabs button:hover { color:var(--teal); }
.tabs button.active { color:var(--teal); }
.tabs button.active:after { background:var(--teal); }
.tab-count {
  font:700 11px var(--latin);
  background:var(--teal);
  color:#fff;
  border-radius:999px;
  padding:1px 8px;
}
.tab-count[hidden] { display:none; }

.drawer-body {
  overflow:auto;
  padding:32px 36px 40px;
  flex:1;
  min-height:0;
  background:#f7f9fb;
}
.drawer-body.flush {
  overflow:hidden;
  padding:18px 24px 14px;
  display:flex;
  flex-direction:column;
}
.drawer-pane[hidden] { display:none; }

/* Issue pane */
.issue-wrap { max-width:920px; margin:0 auto; }
.detail-label {
  font:700 12px var(--latin);
  color:var(--teal);
  letter-spacing:.08em;
}
.detail-card {
  margin-top:14px;
  background:#fff;
  border:1px solid var(--border);
  border-left:4px solid var(--red);
  border-radius:12px;
  padding:26px 30px;
  box-shadow:var(--shadow-sm);
}
.detail-text {
  line-height:2.05;
  font-size:18px;
  white-space:pre-line;
}

/* Action pane */
.action-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:18px;
  max-width:1200px;
  margin:0 auto;
}
.action-card {
  position:relative;
  border:1px solid var(--border);
  border-top:4px solid var(--teal);
  border-radius:12px;
  background:#fff;
  padding:22px 22px 24px;
  box-shadow:var(--shadow-sm);
}
.action-card .num {
  position:absolute;
  top:18px; right:20px;
  font:800 26px var(--latin);
  color:#d8e8eb;
}
.action-card small {
  font:700 11.5px var(--latin);
  color:var(--teal);
  letter-spacing:.08em;
}
.action-card h3 {
  font:700 19px var(--latin);
  margin:8px 0 12px;
  padding-right:40px;
}
.action-card p {
  font-size:15.5px;
  line-height:2;
  white-space:pre-line;
  color:#2b4253;
}
.no-data {
  padding:44px 18px;
  border:1px dashed #c6d9e1;
  border-radius:12px;
  color:var(--muted);
  text-align:center;
  background:#fbfcfd;
}
.issue-wrap .no-data, #actionPane > .no-data { max-width:920px; margin:0 auto; background:#fff; }

/* Evidence pane */
#evidencePane:not([hidden]) {
  display:flex;
  flex-direction:column;
  flex:1;
  min-height:0;
  gap:12px;
}
.evidence-controls {
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.ev-info {
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:9px;
  padding:7px 12px;
  max-width:420px;
  min-width:0;
}
.ev-info svg { flex:0 0 auto; color:var(--teal); }
.smallprint {
  font:500 13px var(--latin);
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.search-wrap {
  position:relative;
  flex:1;
  min-width:220px;
}
.search-wrap svg {
  position:absolute;
  left:12px; top:50%;
  transform:translateY(-50%);
  color:#8aa0ae;
  pointer-events:none;
}
#search {
  width:100%;
  border:1px solid var(--border);
  border-radius:9px;
  padding:9px 12px 9px 38px;
  background:#fff;
  font:14px var(--latin);
}
#search:disabled { background:#f1f4f6; cursor:not-allowed; }
.upload {
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--teal);
  color:#fff;
  padding:9px 16px;
  border-radius:9px;
  font:600 14px var(--latin);
  cursor:pointer;
  box-shadow:0 3px 10px #0f7c8738;
  transition:background .15s;
  white-space:nowrap;
}
.upload:hover { background:var(--teal-dark); }
.upload input { display:none; }

.evidence-stage {
  position:relative;
  flex:1;
  min-height:0;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
  overflow:hidden;
}
.evidence-table {
  height:100%;
  overflow:auto;
}
table.ev {
  border-collapse:separate;
  border-spacing:0;
  width:max-content;
  min-width:100%;
  font:13.5px/1.6 var(--latin);
  text-align:left;
}
.ev th {
  position:sticky;
  top:0;
  z-index:2;
  background:#eef4f6;
  color:#3d586b;
  font-size:12px;
  font-weight:700;
  letter-spacing:.03em;
  white-space:nowrap;
  padding:11px 16px;
  border-bottom:1px solid #d6e2e8;
  border-right:1px solid #e3ebef;
}
.ev td {
  padding:10px 16px;
  border-bottom:1px solid #edf2f4;
  border-right:1px solid #f1f5f7;
  vertical-align:top;
  background:#fff;
}
.ev tbody tr.row { cursor:pointer; }
.ev tbody tr.row:nth-child(even) td { background:#fafcfd; }
.ev tbody tr.row:hover td { background:#eef7f8; }
.ev tbody tr.row.selected td { background:#dff0f2; }
.ev .rn {
  position:sticky;
  left:0;
  z-index:1;
  width:58px;
  min-width:58px;
  text-align:right;
  color:#8fa3b0;
  font-variant-numeric:tabular-nums;
  font-size:12px;
}
.ev th.rn { z-index:3; }
.ev .c1 {
  position:sticky;
  left:58px;
  z-index:1;
  font-weight:600;
  box-shadow:inset -1px 0 0 #d6e2e8, 6px 0 8px -6px #1230452e;
}
.ev th.c1 { z-index:3; }
.cell {
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
  white-space:pre-wrap;
  word-break:break-word;
}
.ev td .no-data { border:0; padding:70px 18px; background:transparent; font-size:15px; }
mark {
  background:#ffe69c;
  color:inherit;
  border-radius:3px;
  padding:0 1px;
}
.pill {
  display:inline-block;
  border-radius:999px;
  padding:1px 10px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.pill.s-ok { background:#e3f4e9; color:#187455; }
.pill.s-bad { background:#fbe6e6; color:#a33c43; }
.pill.s-wait { background:#fdf1d9; color:#8a5f22; }

/* Row detail panel */
.row-detail {
  position:absolute;
  top:0; right:0; bottom:0;
  width:min(520px,100%);
  background:#fff;
  border-left:1px solid var(--border);
  box-shadow:-18px 0 40px #12304524;
  display:flex;
  flex-direction:column;
  z-index:5;
  animation:slide .2s ease;
}
.row-detail[hidden] { display:none; }
.rd-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  background:#f7fafb;
}
.rd-head strong {
  font:700 15px var(--latin);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.rd-body {
  margin:0;
  overflow:auto;
  padding:6px 18px 24px;
  flex:1;
}
.rd-item {
  padding:12px 0;
  border-bottom:1px solid var(--border-soft);
}
.rd-item dt {
  font:700 11.5px var(--latin);
  color:var(--teal);
  letter-spacing:.04em;
  margin-bottom:4px;
}
.rd-item dd {
  margin:0;
  font:14px/1.7 var(--latin);
  white-space:pre-wrap;
  word-break:break-word;
}
.rd-item dd.empty { color:#a3b3be; }
.rd-item pre {
  margin:0;
  font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:#f4f7f9;
  border:1px solid var(--border-soft);
  border-radius:8px;
  padding:10px 12px;
  white-space:pre-wrap;
  word-break:break-word;
}

.drop-hint {
  position:absolute;
  inset:10px;
  border:2px dashed var(--teal);
  border-radius:12px;
  background:#eaf5f6e6;
  display:grid;
  place-items:center;
  font:700 16px var(--latin);
  color:var(--teal);
  z-index:6;
  pointer-events:none;
}
.drop-hint[hidden] { display:none; }

.ev-footer {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
}
.pager {
  display:flex;
  gap:10px;
  align-items:center;
  font:13px var(--latin);
  color:var(--muted);
}
.pager button {
  border:1px solid var(--border);
  padding:6px 14px;
  border-radius:8px;
  background:#fff;
  font-weight:600;
  font-size:13px;
}
.pager button:hover:not(:disabled) { border-color:var(--teal); color:var(--teal); }
.pager button:disabled { opacity:.4; cursor:default; }
#pageLabel { font-weight:700; color:var(--ink); min-width:48px; text-align:center; }
#rangeLabel { font-variant-numeric:tabular-nums; }
.footnote {
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}

/* ANIMATION */

@keyframes travel { to { background-position:12px 0; } }
@keyframes travelDown { to { background-position:0 12px; } }
@keyframes travelPath { to { stroke-dashoffset:-34; } }
@keyframes slide {
  from { transform:translateX(25px); opacity:.6; }
  to { transform:none; opacity:1; }
}
@keyframes pop {
  from { transform:translateY(14px) scale(.985); opacity:0; }
  to { transform:none; opacity:1; }
}
@keyframes fade { from { opacity:0; } to { opacity:1; } }

/* RESPONSIVE */

@media(max-width:1050px) {
  .flow.six {
    flex-direction:column;
    max-width:620px;
    margin:auto;
  }
  .flow.six .node {
    width:100%;
    min-height:78px;
    flex:none;
    flex-direction:row;
    text-align:left;
    justify-content:flex-start;
  }
  .flow.six .arrow { transform:rotate(90deg); }
  .nav { display:none; }
}
@media(max-width:700px) {
  .shell { width:calc(100% - 28px); }
  .hero { padding:34px 0; }
  .meta { display:none; }
  .section-title { padding:18px 20px; gap:14px; }
  .section-num { font-size:32px; padding-right:14px; }
  .section-title h2 { font-size:24px; }
  .incident { padding:20px 16px; }
  .incident-head { flex-wrap:wrap; }
  .incident-head h3 { font-size:18px; }
  .flow { flex-direction:column; }
  .flow .node {
    width:100%;
    flex:none;
    min-height:84px;
    flex-direction:row;
    justify-content:flex-start;
    text-align:left;
  }
  .arrow { transform:rotate(90deg); }
  .fork { display:none; }
  .branch-pair {
    grid-template-columns:1fr;
    gap:32px;
    margin:20px 0;
  }
  .branch { min-height:150px; }
  .branch-pair:before,.branch-pair:after {
    content:'↓';
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    color:var(--teal);
    font-size:24px;
  }
  .branch-pair:before { top:-31px; }
  .branch-pair:after { bottom:-32px; }
  .compare { grid-template-columns:1fr; }
  .versus { margin:auto; }
  .table-card { padding:16px; }

  #inspector,#inspector.max {
    width:100vw;
    height:100vh;
    height:100dvh;
    border-radius:0;
  }
  #maximize { display:none; }
  .drawer-header { padding:16px 16px 14px; }
  .drawer-heading h2 { font-size:19px; }
  .tabs { padding:0 6px; overflow-x:auto; }
  .tabs button { padding:12px 12px; font-size:14px; white-space:nowrap; }
  .drawer-body { padding:20px 16px 28px; }
  .drawer-body.flush { padding:12px 12px 10px; }
  .detail-card { padding:20px; }
  .detail-text { font-size:16.5px; }
  .ev-info { max-width:100%; }
  .ev-footer { flex-direction:column; align-items:stretch; }
  .pager { justify-content:space-between; }
}
/* ========== TOP ACTIONS ========== */

.top-actions { display:flex; gap:8px; align-items:center; }
.top-actions .meta { margin-right:8px; }
.tbtn {
  display:inline-flex;
  align-items:center;
  gap:7px;
  border:1px solid var(--border);
  background:#fff;
  color:var(--navy);
  border-radius:9px;
  padding:7px 13px;
  font:600 13px var(--latin);
  transition:background .15s,border-color .15s,color .15s;
  white-space:nowrap;
}
.tbtn:hover { border-color:var(--teal); color:var(--teal); }
.tbtn.primary {
  background:var(--teal);
  border-color:var(--teal);
  color:#fff;
  box-shadow:0 3px 10px #0f7c8738;
}
.tbtn.primary:hover { background:var(--teal-dark); color:#fff; }
.tbtn svg,.hbtn svg,.tool svg { width:15px; height:15px; flex:0 0 auto; }
kbd {
  font:600 11px var(--latin);
  border:1px solid currentColor;
  border-radius:5px;
  padding:0 5px;
  opacity:.6;
}
@media(max-width:1280px) { .top-actions .meta { display:none; } }

/* ========== HERO ========== */

.hero .shell {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:40px;
  flex-wrap:wrap;
}
.hero-text { flex:1 1 520px; min-width:0; }
.hero-cta { display:flex; gap:10px; margin-top:24px; flex-wrap:wrap; }
.hbtn {
  display:inline-flex;
  align-items:center;
  gap:9px;
  border-radius:10px;
  padding:10px 18px;
  font:600 14px var(--latin);
  border:1px solid #ffffff33;
  background:#ffffff12;
  color:#fff;
  transition:background .15s;
}
.hbtn:hover { background:#ffffff24; }
.hbtn.primary { background:#fff; color:var(--navy); border-color:#fff; }
.hbtn.primary:hover { background:#e4f3f4; }
.glance {
  display:grid;
  grid-template-columns:repeat(2,minmax(132px,1fr));
  gap:12px;
  flex:0 1 340px;
}
.gl {
  background:#ffffff0d;
  border:1px solid #ffffff1c;
  border-radius:14px;
  padding:14px 16px;
}
.gl b {
  display:block;
  font:800 30px/1.15 var(--latin);
  color:#fff;
  font-variant-numeric:tabular-nums;
}
.gl span {
  font:600 11px var(--latin);
  letter-spacing:.09em;
  text-transform:uppercase;
  color:#9fcfd6;
}
.gl.alert b { color:#ff9ea4; }
.print-only { display:none; }

/* ========== FLOW PLAYBACK ========== */

@keyframes rise {
  from { opacity:0; translate:0 12px; }
  to { opacity:1; translate:0 0; }
}
@keyframes ring {
  0% { box-shadow:0 0 0 0 #b3434b59; }
  100% { box-shadow:0 0 0 18px #b3434b00; }
}
.incident.play :is(.node,.branch,.arrow,.down,.fork,.compare,.outcome) {
  animation:rise .55s cubic-bezier(.2,.8,.2,1) both;
  animation-delay:calc(var(--i,0) * 85ms);
}
.incident.play :is(.node.issue,.branch) {
  animation:rise .55s cubic-bezier(.2,.8,.2,1) both, ring 1.3s ease-out 2;
  animation-delay:calc(var(--i,0) * 85ms), calc(var(--i,0) * 85ms + .6s);
}

/* ========== REFERENCE BLOCK ========== */

.ref-block {
  border-radius:16px;
  padding:4px 20px 2px;
  margin:0 -20px;
}
@media(max-width:700px) { .ref-block { padding:0; margin:0; } }

/* ========== AMBIENT LIGHT / FLOATING CARDS ========== */

body { background:var(--bg); }
body::before {
  content:'';
  position:fixed;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background:
    radial-gradient(1100px 620px at 8% 18%,#dcf0f2 0,transparent 62%),
    radial-gradient(900px 560px at 94% 52%,#e6ebfa 0,transparent 60%),
    radial-gradient(800px 500px at 30% 92%,#e3f3ef 0,transparent 60%);
  transform:translateZ(0);
}

.incident,.table-card {
  position:relative;
  box-shadow:
    0 1px 2px #1230450f,
    0 10px 28px -10px #12304529,
    0 30px 60px -30px #0f7c8733;
  transition:box-shadow .45s ease, border-color .45s ease;
}
.incident::before,.table-card::before {
  content:'';
  position:absolute;
  z-index:-1;
  inset:30px 0 -60px;
  background:
    radial-gradient(32% 42% at 24% 62%,#14a7b766,#14a7b730 40%,#14a7b70d 70%,transparent 100%),
    radial-gradient(30% 42% at 78% 62%,#6a83f052,#6a83f026 40%,#6a83f00a 70%,transparent 100%),
    radial-gradient(22% 34% at 52% 66%,#e0646a2b,#e0646a0d 60%,transparent 100%);
  opacity:0;
  transform:translateY(0) scale(1);
  transition:opacity .8s ease, transform .45s ease;
  pointer-events:none;
}
.table-card::before { inset:20px 4% -46px; }
.incident.lit::before,.table-card.lit::before { opacity:1; }
.incident:hover,.table-card:hover {
  border-color:#bcdde1;
  box-shadow:
    0 1px 2px #1230450f,
    0 16px 40px -12px #12304538,
    0 40px 80px -32px #0f7c874d;
}
.incident:hover::before,.table-card:hover::before {
  opacity:1;
  transform:translateY(8px) scale(1.05,1.12);
}
@keyframes breathe {
  0%,100% { opacity:.75; }
  50% { opacity:.45; }
}

.incident.off :is(.arrow,.down,.fork,.node,.branch,.compare,.outcome),
.incident.off :is(.arrow,.down)::before,
.incident.off .fork .signal { animation-play-state:paused !important; }

/* top light edge on each card */
.incident::after,.table-card::after {
  content:'';
  position:absolute;
  top:-1px;
  left:28px;
  right:28px;
  height:2px;
  border-radius:2px;
  background:linear-gradient(90deg,transparent,#14a7b7 30%,#6a83f0 70%,transparent);
  opacity:.55;
  transition:opacity .45s ease;
  pointer-events:none;
}
.incident:hover::after,.table-card:hover::after { opacity:1; }

/* section bands: glow + one-time light sweep */
.section-title {
  position:relative;
  overflow:hidden;
  box-shadow:
    0 14px 34px -14px #132c3f80,
    0 26px 50px -28px #0f7c8780;
}
.section-title::after {
  content:'';
  position:absolute;
  top:0;
  bottom:0;
  left:-40%;
  width:35%;
  background:linear-gradient(100deg,transparent,#ffffff1f,transparent);
  transform:skewX(-18deg);
  pointer-events:none;
}
.section-title.lit::after { animation:sweep 1.6s ease .2s 1 both; }
@keyframes sweep { to { left:120%; } }

/* hero stat cards */
.gl { transition:background .3s,border-color .3s; }
.gl:hover { background:#ffffff18; border-color:#ffffff33; }

/* ========== CASE SUMMARY VIEW ========== */

.summary-view { display:none; }
#evidencePane.summary-mode .summary-view {
  display:block;
  flex:1;
  min-height:0;
  overflow:auto;
  padding:2px 2px 8px;
}
#evidencePane.summary-mode :is(.search-wrap,.tool-wrap,#exportBtn,#insights,#stage,.ev-footer) {
  display:none !important;
}
#evidencePane.summary-mode .evidence-controls { justify-content:flex-end; }
#evidencePane.summary-mode .ev-info { display:none; }
#evidencePane.summary-mode .evidence-controls { display:none !important; }
.sum-stat span { display:block; line-height:1.5; margin-top:4px; }

.sum-head {
  display:grid;
  grid-template-columns:repeat(3,minmax(150px,200px)) 1fr;
  gap:12px;
  margin-bottom:16px;
}
.sum-stat {
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 18px;
  box-shadow:var(--shadow-sm);
}

  display:flex;
  align-items:baseline;
  gap:8px;
  font:800 30px/1.15 var(--latin);
  color:var(--navy);
  font-variant-numeric:tabular-nums;
}
.sum-stat b em {
  font:700 14px var(--latin);
  font-style:normal;
  color:var(--red);
}
.sum-stat span {
  font:600 11.5px var(--latin);
  letter-spacing:.07em;
  text-transform:uppercase;
  color:var(--muted);
}
.sum-stat.accent b { color:var(--teal); }
.sum-stat.hot {
  background:linear-gradient(135deg,#fff3f2,#fff 75%);

}
.sum-stat.hot b { color:#9b3940; }
.sum-src {
  align-self:center;
  padding:6px 4px 6px 16px;
  border-left:3px solid var(--teal);

  flex-direction:column;

}
.sum-src strong { font:700 14px var(--latin); color:var(--ink); }
.sum-src span { font:500 13px var(--latin); color:var(--muted); }

.sum-grid {
  display:grid;
  grid-template-columns:minmax(320px,.9fr) 1.4fr;

  align-items:start;
}
.sum-card {
  background:#fff;

}

.bars { display:flex; flex-direction:column; gap:10px; }

.bar-n { text-align:right; font-variant-numeric:tabular-nums; color:var(--ink); }
.bar-p { text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); font-weight:500; }

.ex-card {

.ex-head {

.ex-num {

}
.ex-head strong { font:700 15px var(--latin); color:var(--ink); }
.ex-card dl { margin:0; }
.ex-row {

}
.ex-row dt { font:600 12px/1.6 var(--latin); color:var(--muted); }
.ex-row dd {
  margin:0;
  font:500 13.5px/1.6 var(--latin);
  color:var(--ink);

@media(max-width:1000px) {
  .sum-head { grid-template-columns:repeat(3,1fr); }

.resp .value.list {

}
.codes-card { margin-bottom:16px; }
table.codes {
  border-collapse:collapse;

  min-width:680px;

  text-align:left;
}
table.codes th {
  background:#f1f6f8;

  text-transform:uppercase;

table.codes td {

table.codes tbody tr:first-child td { border-top:0; }
.c-bank { font-weight:800; color:var(--navy); white-space:nowrap; }
.c-n { text-align:right; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
.code-chip {
  display:inline-block;
  font:700 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:#fbecec;
  color:#9b3d44;
  border:1px solid #f0cfd1;
  border-radius:6px;
  padding:1px 8px;
  white-space:nowrap;
}
.prob {
  display:inline-block;
  border-radius:999px;
  padding:2px 10px;
  font:600 12px/1.5 var(--latin);
}
.prob.bad { background:#fbe6e6; color:#a33c43; }
.prob.warn { background:#fdf1d9; color:#8a5f22; }

.sum-meaning {
  display:flex;
  align-items:flex-start;
  gap:14px;
  margin:-4px 0 16px;
  padding:14px 18px;
  border-radius:12px;
  border:1px solid var(--border);
  border-left:4px solid var(--teal);
  background:#fff;
  box-shadow:var(--shadow-sm);
}
.sum-meaning p { margin:0; font:500 15px/1.65 var(--latin); color:var(--ink); white-space:pre-line; }
.sum-tag {
  flex:0 0 auto;
  font:700 12px var(--latin);
  letter-spacing:.03em;
  border-radius:999px;
  padding:4px 12px;
  margin-top:1px;
  white-space:nowrap;
}
.sum-meaning.tone-ok { border-left-color:var(--green); }
.sum-meaning.tone-ok .sum-tag { background:#e3f4e9; color:#187455; }
.sum-meaning.tone-warn { border-left-color:#c58a2b; background:#fffaf0; }
.sum-meaning.tone-warn .sum-tag { background:#fdf1d9; color:#8a5f22; }
.sum-meaning.tone-bad { border-left-color:var(--red); background:#fff7f6; }
.sum-meaning.tone-bad .sum-tag { background:#fbe6e6; color:#a33c43; }
@media(max-width:700px) { .sum-meaning { flex-direction:column; gap:8px; } }

/* ========== EVIDENCE TOOLS ========== */

.tool-wrap { position:relative; }
.tool {
  display:inline-flex;
  align-items:center;
  gap:7px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:9px;
  padding:8px 13px;
  font:600 13.5px var(--latin);
  color:var(--navy);
  white-space:nowrap;
  transition:border-color .15s,color .15s;
}
.tool:hover:not(:disabled) { border-color:var(--teal); color:var(--teal); }
.tool:disabled { opacity:.45; cursor:not-allowed; }
.tool .badge {
  font:700 11px var(--latin);
  background:var(--light);
  color:var(--teal);
  border-radius:999px;
  padding:0 7px;
}
.tool .badge[hidden] { display:none; }
.col-pop {
  position:absolute;
  top:calc(100% + 6px);
  right:0;
  z-index:8;
  width:300px;
  max-height:380px;
  overflow:auto;
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow:0 18px 40px #12304529;
  padding:6px 8px 8px;
  animation:fade .15s ease;
}
.col-pop[hidden] { display:none; }
.cp-head {
  position:sticky;
  top:-6px;
  background:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 8px;
  border-bottom:1px solid var(--border-soft);
  margin-bottom:4px;
  font:700 12px var(--latin);
  color:var(--muted);
  letter-spacing:.04em;
}
.cp-head button {
  border:0;
  background:none;
  color:var(--teal);
  font:600 12.5px var(--latin);
  padding:2px 4px;
}
.col-pop label {
  display:flex;
  align-items:center;
  gap:10px;
  padding:7px 8px;
  border-radius:8px;
  font:500 13.5px var(--latin);
  cursor:pointer;
}
.col-pop label:hover { background:#f2f7f8; }
.col-pop input { accent-color:var(--teal); width:16px; height:16px; margin:0; }

/* ========== INSIGHTS ========== */

.insights {
  display:flex;
  gap:8px;
  align-items:stretch;
  overflow-x:auto;
  padding:2px 2px 4px;
}
.insights[hidden] { display:none; }
.ins {
  position:relative;
  flex:0 0 auto;
  min-width:128px;
  max-width:260px;
  text-align:left;
  border:1px solid var(--border);
  background:#fff;
  border-radius:12px;
  padding:9px 15px 10px;
  display:flex;
  flex-direction:column;
  gap:1px;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.ins:hover { border-color:var(--teal); box-shadow:0 4px 14px #0f7c871f; }
.ins.active { box-shadow:inset 0 0 0 2px var(--teal); background:#f1f9fa; border-color:var(--teal); }
.ins-n {
  font:800 22px/1.2 var(--latin);
  font-variant-numeric:tabular-nums;
  color:var(--navy);
}
.ins-l {
  font:600 12px/1.4 var(--latin);
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.ins.alert {
  background:linear-gradient(135deg,#fff3f2,#fff 70%);
  border-color:#efc3c5;
  padding-right:30px;
}
.ins.alert .ins-n { color:var(--red); }
.ins.alert .ins-l { color:#8c4a50; }
.ins.alert.active { box-shadow:inset 0 0 0 2px var(--red); background:#fff0ef; border-color:var(--red); }
.ins.alert.zero { background:#fff; border-color:var(--border); }
.ins.alert.zero .ins-n { color:var(--green); }
.ins.alert.zero .ins-l { color:var(--muted); }
.ins .dot {
  position:absolute;
  top:13px;
  right:13px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--red);
  animation:blink 1.6s ease-out infinite;
}
@keyframes blink {
  0% { box-shadow:0 0 0 0 #b3434b80; }
  100% { box-shadow:0 0 0 9px #b3434b00; }
}
.ins.s-ok .ins-n { color:var(--green); }
.ins.s-bad .ins-n { color:var(--red); }
.ins.s-wait .ins-n { color:var(--amber); }
.ins-map {
  margin-left:auto;
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:6px;
  padding:4px 2px 4px 14px;
  border-left:1px dashed var(--border);
}
.ins-map label {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  font:600 11.5px var(--latin);
  color:var(--muted);
  white-space:nowrap;
}
.ins-map select {
  font:500 12.5px var(--latin);
  border:1px solid var(--border);
  border-radius:7px;
  padding:3px 6px;
  background:#fff;
  color:var(--ink);
  max-width:132px;
}
.no-data svg { display:block; margin:0 auto 12px; color:#a7c0ca; }

@media(max-width:700px) {
  .top-actions .tbtn span { display:none; }
  .hero-cta kbd { display:none; }
  .glance { flex:1 1 100%; }
  .ins-map { margin-left:0; }
}

/* ========== PRINT / PDF ========== */

@media print {
  @page { size:A4 portrait; margin:10mm; }
  * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  *,*:before,*:after { animation:none !important; transition:none !important; }
  html { scroll-behavior:auto; }
  body { background:#fff; zoom:.82; }
  .top,#scrim,#inspector,.hero-cta,.inspect-hint,.incident::before,.table-card::before { display:none !important; }
  .print-only {
    display:block;
    margin-top:10px;
    font:600 12px var(--latin);
    letter-spacing:.08em;
    color:#9fcfd6;
  }
  .shell { width:100%; }
  .hero { padding:26px 30px; border-radius:16px; break-inside:avoid; }
  main { padding:18px 0 0; }
  .section { margin:0 0 18px; }
  #debit { break-before:page; }
  .incident,.table-card,.section-title,.compare,.chain,.branch-pair,.ref-block .reference {
    break-inside:avoid;
  }
  .incident,.section-title,.table-card { box-shadow:none; }
  .flow,.flow.six { flex-direction:row; max-width:none; }
  .flow .node,.flow.six .node {
    flex:1;
    width:auto;
    flex-direction:column;
    text-align:center;
    justify-content:center;
    min-height:124px;
  }
  .arrow,.flow.six .arrow { transform:none; }
  .fork { display:block; }
  .branch-pair { grid-template-columns:1fr 1fr; margin:0; }
  .branch-pair:before,.branch-pair:after { content:none; }
  .compare { grid-template-columns:1fr 40px 1fr; }
  .glance { flex:0 1 340px; }
  .ref-block { padding:0; margin:0; }
}

@media(prefers-reduced-motion:reduce) {
  *,*:before,*:after { animation:none!important; transition:none!important; }
}

/* DIAGRAM HELPERS */

function node(k,label,status='',note='',id=''){
  const inner = `
    <span class="glyph">${glyph(k)}</span>
    <strong>${label}</strong>
    ${note ? `<small>${note}</small>` : ''}
    ${id
      ? '<span class="inspect-hint">មើលព័ត៌មាន ↗</span>'
      : ''}
  `;

  return id
    ? `<button type="button"
               class="node ${status}"
               data-issue="${id}">
         ${inner}
       </button>`
    : `<div class="node ${status}">${inner}</div>`;
}

const arrow = () =>
  '<span class="arrow" aria-hidden="true"></span>';

const down = () =>
  '<span class="down" aria-hidden="true"></span>';

function flow(items,extra=''){
  return `
    <div class="flow ${extra}">
      ${items.map((x,i) =>
        (i ? arrow() : '') + node(...x)
      ).join('')}
    </div>
  `;
}

function panel(n,title,content,result=''){
  return `
    <article class="incident">
      <div class="incident-head">
        <span class="index">DIAGRAM ${n}</span>
        <h3>${title}</h3>
      </div>

      ${content}

      ${result
        ? `<p class="outcome">
             <b>លទ្ធផល៖</b> ${result}
           </p>`
        : ''}
    </article>
  `;
}

function band(n,en,kh){
  return `
    <div class="section-title">
      <span class="section-num">${n}</span>

      <div>
        <h2>${en}</h2>
        <p>${kh}</p>
      </div>
    </div>
  `;
}

function fork(merge=false){

        'M250 0 V28 H500 V77',

      ]
    : [
        'M500 0 V28 H250 V77',

      ];

  const tips = merge
    ? 'M493 72L500 82L507 72Z'
    : 'M243 72L250 82L257 72Z ' +
      'M743 72L750 82L757 72Z';

  return `
    <svg class="fork"
         viewBox="0 0 1000 84"
         preserveAspectRatio="none"
         aria-hidden="true">

      ${lines.map(d => `
        <path class="base" d="${d}"/>
        <path class="signal" d="${d}"/>
      `).join('')}

      <path class="tip" d="${tips}"/>
    </svg>
  `;
}

function callback(which){

  const diagram = `
    <div class="callback">

      <div class="chain">
        ${node(isDebit ? 'card' : 'phone',source)}

        ${down()}

        ${node(
          'check',
          'ធនាគារកាត់ប្រាក់ជោគជ័យ',
          'good'
        )}
      </div>

      ${fork()}

      <div class="branch-pair">

        <button type="button"
                class="branch"
                data-issue="${which}-a">

          <span class="case-id">

          </span>

          <strong>Callback មកដល់ EDC</strong>

          <p>${caseA}</p>

          <span class="inspect-hint">
            មើលព័ត៌មាន ↗
          </span>
        </button>

        <button type="button"
                class="branch"
                data-issue="${which}-b">

          <span class="case-id">
            CASE B · NO CALLBACK
          </span>

          <strong>Callback មិនមកដល់ EDC</strong>

          <p>${caseB}</p>

          <span class="inspect-hint">
            មើលព័ត៌មាន ↗
          </span>
        </button>

        <span class="or">ឬ</span>
      </div>

      ${fork(true)}

      <div class="chain">
        ${node(
          'server',
          'EDC មិនបានកត់ត្រាលទ្ធផលជោគជ័យ (Pending)',
          'pending'
        )}

        ${down()}

        ${node(
          'expired',
          'ផុតកំណត់ (Expired)',
          'end'
        )}
      </div>
    </div>
  `;

  return panel(
    '02',
    'ធនាគារកាត់ប្រាក់ជោគជ័យ ប៉ុន្តែ EDC មិនទទួលបានលទ្ធផលជោគជ័យ',

  );
}

/* CSV IMPORT */

function parseCSV(text){
  text = text.replace(/^\uFEFF/,'');
  const out = [];

  let row = [];
  let cell = '';
  let quoted = false;

  for(let i=0;i<text.length;i++){
    const char = text[i];

    if(char === '"'){
      if(quoted && text[i+1] === '"'){
        cell += '"';
        i++;
      }else{
        quoted = !quoted;
      }

    }else if(char === ',' && !quoted){
      row.push(cell);
      cell = '';

    }else if(
      (char === '\n' || char === '\r') && !quoted
    ){
      if(char === '\r' && text[i+1] === '\n') i++;

      row.push(cell);

      if(row.some(x => x.trim())) out.push(row);

      row = [];
      cell = '';

    }else{
      cell += char;
    }
  }

  row.push(cell);
  if(row.some(x => x.trim())) out.push(row);

  return out;
}

/* column width profile: short / medium / long text */
function profile(cols,rows){
  return cols.map((name,i) => {
    let max = String(name).length;
    const n = Math.min(rows.length,400);
    for(let r=0;r<n;r++){
      const len = String(rows[r][i] ?? '').length;
      if(len > max) max = len;
      if(max > 60) break;
    }
    if(max > 40) return {min:300,max:460};
    if(max > 16) return {min:170,max:300};
    return {min:100,max:200};
  });
}

async function handleFile(file){
  if(!file || !current) return;

  try{
    const rows = parseCSV(await file.text());

    if(rows.length < 2){
      throw Error('CSV contains no transaction rows');
    }

    const cols = rows[0];
    const data = rows.slice(1);

    evidence[current] = {
      name:file.name,
      cols,
      rows:data,
      widths:profile(cols,data)
    };

    updateCount();
    renderEvidence();

  }catch(err){
    $('eHelp').textContent =
      'Unable to read CSV: ' + err.message;
  }
}

/* guess which columns hold the bank result and the EDC result */
function detectMap(cols){
  const n = cols.map(c => String(c).toLowerCase());
  const find = (...tests) => {
    for(const t of tests){
      const i = n.findIndex(t);
      if(i > -1) return i;
    }
    return -1;
  };

  const edc = find(
    c => c.includes('edc') && c.includes('status'),
    c => c.includes('edc') && /(state|result)/.test(c),
    c => c.includes('status') && !c.includes('bank')
  );

  const bank = find(
    c => c.includes('bank') && c.includes('status'),
    c => c.includes('bank') && /(state|result)/.test(c)
  );

  return { edc, bank: bank === edc ? -1 : bank };
}

function ensureState(f){
  if(!f.map) f.map = detectMap(f.cols);
  if(!f.filter) f.filter = { type:'all' };
  if(!f.hidden) f.hidden = new Set();
}

function visibleCols(f){
  return f.cols.map((_,i) => i).filter(i => !f.hidden.has(i));
}

function renderEvidence(){
  const file = evidence[current];
  if(file) ensureState(file);

  $('exportBtn').disabled = !file;

  renderInsights();
  renderColPop();
  drawTable();
}

/* ---------- filters ---------- */

function passFilter(f,row){
  const t = f.filter;
  if(t.type === 'mismatch'){
    return isOk(row[f.map.bank]) && !isOk(row[f.map.edc]);
  }
  if(t.type === 'value'){
    return (String(row[t.col] ?? '').trim() || '—') === t.value;
  }
  return true;
}

function setFilter(next){
  const f = evidence[current];
  if(!f) return;

  const same = JSON.stringify(f.filter) === JSON.stringify(next);
  f.filter = next.type !== 'all' && same ? { type:'all' } : next;

  page = 0;
  closeRow();
  markInsights();
  drawTable();
}

  f.cols.forEach((c,i) => {

          cb.checked = true;
          return;

      drawTable();

    const s = document.createElement('span');
    s.textContent = c || `#${i+1}`;

    l.append(cb,s);
    pop.append(l);

/* ---------- export ---------- */

function exportCSV(){
  const f = evidence[current];
  if(!f) return;

  const idx = visibleCols(f);
  const esc = v => {
    v = String(v ?? '');
    return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
  };

  const lines = [idx.map(i => esc(f.cols[i])).join(',')];
  visible.forEach(({row}) =>
    lines.push(idx.map(i => esc(row[i])).join(','))
  );

  const blob = new Blob(
    ['﻿' + lines.join('\r\n')],
    { type:'text/csv;charset=utf-8' }
  );

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = f.name.replace(/\.csv$/i,'') + '-filtered.csv';
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href),2000);
}

/* ---------- table ---------- */

function highlight(el,text,q){
  if(!q){ el.textContent = text; return; }
  const lower = text.toLowerCase();
  let i = 0, j;
  while((j = lower.indexOf(q,i)) > -1){
    el.append(text.slice(i,j));
    const m = document.createElement('mark');
    m.textContent = text.slice(j,j+q.length);
    el.append(m);
    i = j + q.length;
  }
  el.append(text.slice(i));
}

function statusClass(v){
  const t = v.trim();
  if(!t || t.length > 22) return '';
  if(/^(success|successful|succeeded|paid|completed|complete|approved)$/i.test(t)) return 's-ok';
  if(/^(expired|failed|fail|failure|error|rejected|declined|cancel+ed|timeout)$/i.test(t)) return 's-bad';
  if(/^(pending|processing|waiting|in progress)$/i.test(t)) return 's-wait';
  return '';
}

    th.textContent = columns[i];
    if(k === 0) th.className = 'c1';
    if(file) th.style.minWidth = file.widths[i].min + 'px';
    headerRow.append(th);
  });

  head.append(headerRow);

  const query = $('search').value.trim().toLowerCase();

  visible = file
    ? file.rows
        .map((row,n) => ({ row, idx:n }))
        .filter(({row}) =>
          passFilter(file,row) &&
          (!query || row.some(value =>
            String(value).toLowerCase().includes(query)
          ))
        )
    : [];

  const pages = Math.max(1,Math.ceil(visible.length / PAGE_SIZE));
  page = Math.min(page,pages-1);

  $('pageLabel').textContent = file ? `${page+1} / ${pages}` : '—';

  const start = page * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE,visible.length);
  $('rangeLabel').textContent = file && visible.length
    ? `${(start+1).toLocaleString()}–${end.toLocaleString()} / ${visible.length.toLocaleString()}`
    : '';

  $('prev').disabled = !file || page === 0;
  $('next').disabled = !file || page >= pages-1;
  $('exportBtn').disabled = !file || !visible.length;

  if(!visible.length){
    const tr = document.createElement('tr');
    const td = document.createElement('td');

    td.colSpan = idx.length + 1;

    const box = document.createElement('div');
    box.className = 'no-data';
    box.innerHTML = emptyIcon;
    box.append(file
      ? 'រកមិនឃើញប្រតិបត្តិការ'
      : 'មិនទាន់មានរបាយការណ៍ពី Dev។');

    td.append(box);
    tr.append(td);
    body.append(tr);

  }else{
    visible.slice(start,end).forEach(({row,idx:n}) => {
      const tr = document.createElement('tr');
      tr.className = 'row' + (n === selected ? ' selected' : '');
      tr.tabIndex = 0;
      tr.dataset.idx = n;

      const rn = document.createElement('td');
      rn.className = 'rn';
      rn.textContent = (n+1).toLocaleString();
      tr.append(rn);

      idx.forEach((i,k) => {
        const td = document.createElement('td');
        if(k === 0) td.className = 'c1';

        const value = String(row[i] ?? '');
        const div = document.createElement('div');
        div.className = 'cell';
        div.style.maxWidth = file.widths[i].max + 'px';

        const sc = statusClass(value);
        if(sc){
          const pill = document.createElement('span');
          pill.className = 'pill ' + sc;
          highlight(pill,value,query);
          div.append(pill);
        }else{
          highlight(div,value,query);
        }

        if(value.length > 60) td.title = value;

        td.append(div);
        tr.append(td);
      });

      tr.onclick = () => openRow(n);
      tr.onkeydown = e => {
        if(e.key === 'Enter'){ e.preventDefault(); openRow(n); }
      };

      body.append(tr);
    });
  }

  $('eHelp').textContent = file
    ? 'ទិន្នន័យបង្ហាញនៅក្នុង Browser នេះប៉ុណ្ណោះ មិនបានបញ្ជូនទៅ Server ទេ។'
    : 'មិនទាន់មានរបាយការណ៍ពី Dev។ Import CSV ដើម្បីបង្ហាញទិន្នន័យ។';
}

function prettyJSON(v){
  const t = v.trim();
  if(!(t.startsWith('{') || t.startsWith('['))) return null;
  try{ return JSON.stringify(JSON.parse(t),null,2); }
  catch{ return null; }
}

  $('rdTitle').textContent =
    '#' + (idx+1).toLocaleString() +
    (row[0] ? ' · ' + row[0] : '');

  const dl = $('rdBody');
  dl.replaceChildren();

  file.cols.forEach((name,i) => {
    const item = document.createElement('div');
    item.className = 'rd-item';

    const dt = document.createElement('dt');
    dt.textContent = name;

    const dd = document.createElement('dd');
    const value = String(row[i] ?? '');
    const json = prettyJSON(value);

    if(json){
      const pre = document.createElement('pre');
      pre.textContent = json;
      dd.append(pre);
    }else if(!value.trim()){
      dd.className = 'empty';
      dd.textContent = '—';
    }else{
      const sc = statusClass(value);
      if(sc){
        const pill = document.createElement('span');
        pill.className = 'pill ' + sc;
        pill.textContent = value;
        dd.append(pill);
      }else{
        dd.textContent = value;
      }
    }

    item.append(dt,dd);
    dl.append(item);
  });

  dl.scrollTop = 0;
  $('rowDetail').hidden = false;

  document.querySelectorAll('#eBody tr.row').forEach(tr =>
    tr.classList.toggle('selected',Number(tr.dataset.idx) === idx)
  );
}

function closeRow(){
  $('rowDetail').hidden = true;
  selected = -1;
  document.querySelectorAll('#eBody tr.selected').forEach(tr =>
    tr.classList.remove('selected')
  );
}

$('rdClose').onclick = closeRow;

$('search').oninput = () => {
  page = 0;
  closeRow();
  drawTable();
};

$('prev').onclick = () => {
  page--;
  drawTable();
  $('evScroll').scrollTop = 0;
};

$('next').onclick = () => {
  page++;
  drawTable();
  $('evScroll').scrollTop = 0;
};


/* ========== CASE SUMMARY VIEW ========== */

function el(tag,cls,text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}

function renderSummary(s){
  const box = $('summaryView');
  box.replaceChildren();

  $('reportInfo').textContent = s.source;
  $('reportInfo').title = s.source + ' · ' + s.period;

  const total = s.total;
  const top = s.banks[0];
  const pct = n => (n / total * 100).toFixed(n / total >= .1 ? 0 : 1) + '%';

  /* headline */
  const head = el('div','sum-head');

  const t = el('div','sum-stat');
  t.append(el('b',null,total.toLocaleString()),el('span',null,'Transactions in this case'));

  const b = el('div','sum-stat accent');
  b.append(el('b',null,String(s.banks.length)),el('span',null,s.banks.length === 1 ? 'Bank' : 'Banks'));

  const m = el('div','sum-stat hot');
  const mb = el('b',null,top[0]);
  const mp = el('em',null,pct(top[1]));
  mb.append(mp);
  m.append(mb,el('span',null,'Most affected bank'));

  const src = el('div','sum-src');
  src.append(el('strong',null,s.source),el('span',null,s.period));

  head.append(t,b,m,src);

  /* bank breakdown */
  const bars = el('section','sum-card');
  bars.append(el('h4',null,'Bank breakdown'));
  const list = el('div','bars');
  const max = top[1];
  s.banks.forEach(([name,n],k) => {
    const row = el('div','bar-row' + (k === 0 ? ' top' : ''));
    row.style.setProperty('--d',(k * 60) + 'ms');
    const track = el('div','bar-track');
    const fill = el('i');
    fill.style.setProperty('--w',(n / max * 100) + '%');
    track.append(fill);
    row.append(el('span','bar-name',name),track,el('span','bar-n',n.toLocaleString()),el('span','bar-p',pct(n)));
    list.append(row);
  });
  bars.append(list);

  /* examples */
  const ex = el('section','sum-card');
  ex.append(el('h4',null,'Example transactions'));
  s.examples.forEach((e,k) => {
    const card = el('article','ex-card');
    const h = el('div','ex-head');
    h.append(el('span','ex-num',String(k + 1).padStart(2,'0')),el('strong',null,e.title));
    const dl = el('dl');
    e.fields.forEach(([label,value]) => {
      const row = el('div','ex-row');
      const dd = el('dd',null);
      const sc = statusClass(value);
      if(/^(Status)$/.test(label) && sc){
        dd.append(el('span','pill ' + sc,value));
      }else{
        dd.textContent = value;
      }
      row.append(el('dt',null,label),dd);
      dl.append(row);
    });
    card.append(h,dl);
    ex.append(card);
  });

  const grid = el('div','sum-grid');
  grid.append(bars,ex);

  box.append(head);
  if(s.meaning){
    const mbox = el('div','sum-meaning tone-' + (s.tone || 'ok'));
    mbox.append(el('span','sum-tag',s.tag || ''),el('p',null,s.meaning));
    box.append(mbox);
  }
  if(s.note){
    const n = el('p','sum-note');
    n.append(el('b',null,'!'),el('span',null,s.note));
    box.append(n);
  }

  if(s.codes && s.codes.length){
    const card = el('section','sum-card codes-card');
    card.append(el('h4',null,'Response codes returned by each bank'));
    const wrap = el('div','table-scroll');
    const t = el('table','codes');
    const hr = el('tr');
    ['Bank','Code returned','Bank message','Problem','Rows'].forEach(h => hr.append(el('th',null,h)));
    const th = el('thead'); th.append(hr);
    const tb = el('tbody');
    let prev = '';
    s.codes.forEach(([bank,code,msg,problem,n]) => {
      const tr = el('tr', bank !== prev ? 'first' : '');
      tr.append(
        el('td','c-bank',bank !== prev ? bank : ''),
        el('td','c-code'),
        el('td',null,msg),
        el('td',null),
        el('td','c-n',n.toLocaleString())
      );
      tr.children[1].append(el('span','code-chip',code));
      tr.children[3].append(el('span','prob ' + (problem.startsWith('Wrong') ? 'warn' : 'bad'),problem));
      tb.append(tr);
      prev = bank;
    });
    t.append(th,tb);
    wrap.append(t);
    card.append(wrap);
    box.append(card);
  }

  box.append(grid);
  box.scrollTop = 0;
}

/* ========== FLOW PLAYBACK ========== */

function play(el){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  el.querySelectorAll(
    '.node,.branch,.arrow,.down,.fork,.compare,.outcome'
  ).forEach((n,k) => n.style.setProperty('--i',k));

  el.classList.remove('play');
  void el.offsetWidth;
  el.classList.add('play');
}

if('IntersectionObserver' in window){
  const seen = new WeakSet();
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if(en.isIntersecting && !seen.has(en.target)){
        seen.add(en.target);
        en.target.classList.add('lit');
        if(en.target.classList.contains('incident')) play(en.target);
      }
    });
  },{ threshold:.25 });

  document.querySelectorAll('.incident,.table-card,.section-title')
    .forEach(el => io.observe(el));

  /* only animate what is on screen */
  const vis = new IntersectionObserver(entries => {
    entries.forEach(en => en.target.classList.toggle('off',!en.isIntersecting));
  },{ rootMargin:'120px 0px' });
  document.querySelectorAll('.incident').forEach(el => {
    el.classList.add('off');
    vis.observe(el);
  });
}else{
  document.querySelectorAll('.incident,.table-card,.section-title')
    .forEach(el => el.classList.add('lit'));
}
